name: Python Full Mission Smoke

on:
  push:
    branches: [dev]
    paths:
      - '**/*.py'
      - 'config/*.json'
      - '.github/workflows/python-full-mission-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax compile
        run: python -m compileall -q .
      - name: Install wiring-check dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pymavlink
      - name: Full mission contract
        run: python tools/full_mission_self_check.py
      - name: Production module wiring
        run: python tools/full_mission_wiring_check.py
